/*
 * Versiunile stau aici, o singura data, ca sa nu se bata cap in cap.
 *
 * Sunt alese dintre cele aflate deja in cache-ul Gradle de pe calculatorul de
 * lucru: asa prima construire nu asteapta zeci de megabiti de descarcare.
 */
plugins {
    id 'com.android.application' version '8.9.1' apply false
    id 'org.jetbrains.kotlin.android' version '2.1.0' apply false
    id 'com.google.gms.google-services' version '4.4.2' apply false
}
