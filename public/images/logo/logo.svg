<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#001B66"/>
      <stop offset="100%" stop-color="#1E90FF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="white"/>

  <!-- Circuit lines -->
  <g stroke="#001B66" stroke-width="10" stroke-linecap="round">
    <line x1="180" y1="290" x2="320" y2="290"/>
    <circle cx="180" cy="290" r="14" fill="white"/>
    <circle cx="320" cy="290" r="14" fill="white"/>

    <line x1="140" y1="360" x2="280" y2="360"/>
    <circle cx="140" cy="360" r="14" fill="white"/>

    <line x1="230" y1="430" x2="360" y2="430"/>
    <circle cx="230" cy="430" r="14" fill="white"/>
  </g>

  <!-- DS letters -->
  <text x="280" y="470"
        font-family="Arial, Helvetica, sans-serif"
        font-size="320"
        font-weight="900"
        fill="url(#blueGradient)">
    DS
  </text>

  <!-- Company name -->
  <text x="120" y="650"
        font-family="Arial, Helvetica, sans-serif"
        font-size="110"
        font-weight="700"
        letter-spacing="4"
        fill="url(#blueGradient)">
    DIANA SOFT
  </text>

  <!-- Decorative line -->
  <line x1="420" y1="710" x2="780" y2="710"
        stroke="url(#blueGradient)"
        stroke-width="6"
        stroke-linecap="round"/>
</svg>
